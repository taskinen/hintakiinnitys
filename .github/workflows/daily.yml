name: Daily price fetch & report

on:
  schedule:
    - cron: '0 5 * * *'  # 8 AM Finnish summer time (EEST), 7 AM winter (EET)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch tip instead of the commit that triggered the run,
      # so a re-run builds on the database commit an earlier attempt pushed
      # and its push isn't rejected.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Fetch and store prices
        run: uv run -m hintakiinnitys store

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.db
          git diff --staged --quiet || git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push

      - name: Generate report
        run: |
          mkdir -p _site
          uv run -m hintakiinnitys report > _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # deploy-pages looks the artifact up by name, and that listing can lag the
  # upload by seconds or more (https://github.com/actions/deploy-pages/issues/451).
  # A separate job puts time between upload and lookup, and lets "Re-run failed
  # jobs" retry the deploy alone without uploading a second, same-named artifact.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Retry deploy to GitHub Pages
        id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
